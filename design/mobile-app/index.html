<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KaizenOS Mobile App — screens</title>
<style>
  :root { --gold:#c8a84e; --gold-bright:#e8c870; --ink:#eae3c8; --line:rgba(200,168,78,.22); }
  * { box-sizing:border-box; }
  body { margin:0; background:#000; color:var(--ink); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:22px; padding:14px 28px; background:rgba(0,0,0,.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:11px; letter-spacing:.42em; text-transform:uppercase; color:rgba(232,200,112,.85); font-weight:600; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  nav a { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:rgba(234,227,200,.6); text-decoration:none; padding:7px 12px; border:1px solid transparent; border-radius:999px; }
  nav a:hover { color:var(--gold-bright); border-color:var(--line); }
  header .meta { margin-left:auto; font-size:12px; color:rgba(234,227,200,.4); }
  header .meta a { color:rgba(232,200,112,.8); text-decoration:none; }
  main { padding:28px 28px 80px; }
  section { margin-bottom:56px; scroll-margin-top:70px; }
  section h2 { font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:var(--gold-bright); margin:0 0 4px; }
  section p { margin:0 0 18px; color:rgba(234,227,200,.45); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, 390px); gap:36px 28px; }
  figure { margin:0; }
  figcaption { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:rgba(234,227,200,.6); margin:0 0 8px; display:flex; justify-content:space-between; align-items:baseline; }
  figcaption a { color:rgba(232,200,112,.6); text-decoration:none; font-size:10px; letter-spacing:.1em; text-transform:none; }
  figcaption a:hover { color:var(--gold-bright); }
  iframe { display:block; width:390px; height:844px; border:1px solid var(--line); border-radius:22px; background:#03030a; }
</style>
</head>
<body>
<header>
  <h1>KaizenOS Mobile App</h1>
  <nav id="nav"></nav>
  <span class="meta">39 screens · 390 × 844 · <a href="README.md">README</a></span>
</header>
<main id="main"></main>
<script>
  // Reads canvas.json so the gallery always matches the canvas: same pages,
  // same order, same titles. Positions map to reading order (row, then x).
  fetch('canvas.json').then((r) => r.json()).then((c) => {
    const pages = c.pages || [{ id: 'page-1', name: 'Screens' }];
    const nav = document.getElementById('nav');
    const main = document.getElementById('main');
    const notes = {};
    (c.annotations || []).forEach((n) => { notes[n.page || pages[0].id] = (n.text || '').split('\n')[0]; });
    pages.forEach((p) => {
      const boards = c.artboards
        .filter((a) => (a.page || pages[0].id) === p.id)
        .sort((a, b) => (a.y - b.y) || (a.x - b.x));
      if (!boards.length) return;
      const a = document.createElement('a');
      a.href = '#' + p.id; a.textContent = p.name; nav.appendChild(a);
      const s = document.createElement('section');
      s.id = p.id;
      s.innerHTML = `<h2>${p.name}</h2><p>${boards.length} screens</p><div class="grid"></div>`;
      const g = s.querySelector('.grid');
      boards.forEach((b) => {
        const f = document.createElement('figure');
        f.innerHTML = `<figcaption><span>${b.title || b.file.replace('.dc.html', '')}</span><a href="${b.file}" target="_blank">${b.file}</a></figcaption>
          <iframe src="${b.file}" title="${b.title || b.file}" loading="lazy"></iframe>`;
        g.appendChild(f);
      });
      main.appendChild(s);
    });
  });
</script>
</body>
</html>
