<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796" viewBox="0 0 1290 2796">
  <title>KaizenOS — App Store screenshot frame</title>
  <desc>Background and caption slots for a 6.9" App Store screenshot. Drop the device
  capture into the area below the caption. Colours are the app's own tokens.</desc>

  <defs>
    <!-- the void, exactly as the app draws it -->
    <radialGradient id="void" cx="0.5" cy="0.3" r="0.78">
      <stop offset="0%"   stop-color="#0a0817"/>
      <stop offset="55%"  stop-color="#04030a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <!-- nebula, two soft blooms, screened over the void -->
    <radialGradient id="neb1" cx="0.3" cy="0.25" r="0.6">
      <stop offset="0%"   stop-color="#4b3278" stop-opacity="0.30"/>
      <stop offset="70%"  stop-color="#4b3278" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="0.75" cy="0.75" r="0.5">
      <stop offset="0%"   stop-color="#785032" stop-opacity="0.20"/>
      <stop offset="70%"  stop-color="#785032" stop-opacity="0"/>
    </radialGradient>
    <!-- a little lift under the device so it does not float on flat black -->
    <radialGradient id="pedestal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#c8a84e" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#c8a84e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1290" height="2796" fill="url(#void)"/>
  <rect width="1290" height="2796" fill="url(#neb1)"/>
  <rect width="1290" height="2796" fill="url(#neb2)"/>

